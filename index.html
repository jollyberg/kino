<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kino Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121110; --panel:#1b1a18; --line:#2c2a27; --text:#ece8e1; --muted:#9a948a;
    --accent:#e8b04a; --accent-ink:#1a1408; --chip:#24221f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.4}
  .wrap{max-width:640px;margin:0 auto;padding:0 12px 60px}
  .top{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 6px;margin:0 -12px;padding-left:12px;padding-right:12px}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
  .brand{display:flex;align-items:baseline;gap:8px;min-width:0;padding-bottom:9px;border-bottom:1px solid var(--line)}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;flex:0 0 auto}
  .proto{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 8px;white-space:nowrap}
  .note{color:var(--muted);font-size:11.5px;display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}

  .filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:10px}
  .row{display:grid;gap:5px}
  .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
  .lbl b{color:var(--text);font-weight:600;text-transform:none;letter-spacing:0;font-family:"IBM Plex Mono",monospace}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button,.chip{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-size:14px;padding:5px 11px;border-radius:8px;cursor:pointer}
  .seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .timeline{display:flex;gap:10px;align-items:center}
  input[type=time]{background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font:600 17px "IBM Plex Mono",monospace;color-scheme:dark}
  select{background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;width:100%;color-scheme:dark}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .days{display:flex;gap:6px;align-items:stretch}
  .days select{width:auto;flex:0 0 auto;padding-right:28px}
  .days select.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toggle{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;padding:0;cursor:pointer;justify-self:start;text-decoration:underline;text-underline-offset:3px}

  .summary{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px 0;font-size:13px;color:var(--muted)}
  .summary strong{color:var(--text);font-size:15px}
  .list{display:grid;gap:6px;margin-top:8px}
  .card{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
  .t{font:600 19px "IBM Plex Mono",monospace;color:var(--accent);line-height:1.1}
  .t small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:4px}
  .title{font-weight:600;font-size:16px;margin:0}
  .orig{color:var(--muted);font-size:13px;margin:1px 0 6px}
  .title{margin-bottom:2px}
  .meta{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:12.5px;color:var(--muted)}
  .row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
  .row2 .meta{margin:0}
  .tk{flex:0 0 auto;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--text)!important;background:var(--chip)}
  .tk.direct{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)!important}
  .title a{color:inherit;text-decoration:underline;text-decoration-color:var(--muted);text-decoration-thickness:1px;text-underline-offset:4px}
  .title a::after{content:" \2197";font-size:.8em;color:var(--muted)}
  .credits{font-size:12.5px;color:var(--muted);margin-top:2px}
  .warn{margin-top:8px;font-size:12.5px;color:var(--accent-ink);background:var(--accent);border-radius:8px;padding:6px 10px}
  .badge.unsure{border-style:dashed;opacity:.8}
  .badge.dub{border-color:var(--muted);color:var(--muted)}
  .badge{font:600 11px "IBM Plex Mono",monospace;padding:2px 6px;border-radius:5px;border:1px solid var(--accent);color:var(--accent)}
  .cinema{color:var(--text)}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:12px}
  .hidden{display:none}
  .sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  .sheet.hidden{display:none}
  .sheetHead{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .sheetHead input{flex:1;min-width:0;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .sheetGroups{padding:8px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
  .sheetCount{font-size:12px;color:var(--muted)}
  .sheetBody{overflow-y:auto;padding:4px 12px 40px;-webkit-overflow-scrolling:touch}
  .dist{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
  .cin{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
  .cin input{width:18px;height:18px;accent-color:var(--accent)}
  .cin small{color:var(--muted);font-size:12px;margin-left:auto}
  .card a{color:inherit;text-decoration:none}
  .foot{color:var(--muted);font-size:11.5px;margin-top:28px;line-height:1.5}
  .foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">

  <section class="filters" id="filters">
    <header class="brand">
      <span class="note">Kinoprogramm für Berlin nach Startzeit</span>
    </header>
    <div class="row">
      <div class="days"><div class="seg" id="days"></div><select id="dayMore" aria-label="Weiteres Datum"></select></div>
    </div>

    <div class="row">
      <div class="lbl">Startzeit <b id="winLbl"></b></div>
      <div class="timeline">
        <input type="time" id="time" value="20:00" step="300">
        <div class="seg" id="tol"></div>
      </div>
    </div>

    <div id="more" class="row" style="gap:14px">
      <div class="row">
        <div class="lbl">Fassung</div>
        <div class="seg" id="vers"></div>
      </div>
      <div class="row">
        <div class="lbl">Kinos <b id="cinLbl"></b></div>
        <div class="seg" id="cgroups"></div>
      </div>
      <div class="two">
        <div class="row">
          <div class="lbl">Startpunkt</div>
          <select id="origin"></select>
        </div>
        <div class="row">
          <div class="lbl">Umkreis <b id="radLbl"></b></div>
          <input type="range" id="radius" min="1" max="15.5" step="0.5" value="3">
        </div>
      </div>
    </div>
    <button class="toggle" id="moreBtn">Filter einklappen</button>
  </section>
  <div class="summary"><span><strong id="count">0</strong> Vorstellungen</span><span id="hiddenInfo"></span></div>
 </div>
  <div class="warn hidden" id="warn"></div>
  <div class="list" id="list"></div>
  <p class="foot" id="foot"></p>
</div>

<div class="sheet hidden" id="sheet" role="dialog" aria-label="Kinos auswählen">
  <div class="sheetHead">
    <input type="search" id="cinSearch" placeholder="Kino suchen" autocomplete="off">
    <button type="button" class="chip on" id="cinDone">Fertig</button>
  </div>
  <div class="sheetGroups"><div class="seg" id="sheetGroups"></div><div class="sheetCount" id="sheetCount"></div></div>
  <div class="sheetBody" id="cinList"></div>
</div>
<script>
// ---------- Startpunkte ----------
const ORIGINS = [
  {id:"hermannstr",name:"Neukölln (S+U Hermannstr.)",lat:52.4672,lng:13.4314},
  {id:"nk-nord",name:"Neukölln Nord (Hermannplatz)",lat:52.4867,lng:13.4246},
  {id:"xberg",name:"Kreuzberg (Kotti)",lat:52.4991,lng:13.4180},
  {id:"fhain",name:"Friedrichshain (Boxhagener Pl.)",lat:52.5110,lng:13.4590},
  {id:"mitte",name:"Mitte (Rosenthaler Pl.)",lat:52.5296,lng:13.4015},
  {id:"pberg",name:"Prenzlauer Berg (Eberswalder)",lat:52.5413,lng:13.4120},
  {id:"schoene",name:"Schöneberg (Nollendorfpl.)",lat:52.4996,lng:13.3536},
  {id:"charl",name:"Charlottenburg (Savignypl.)",lat:52.5054,lng:13.3229},
  {id:"wedding",name:"Wedding (Leopoldpl.)",lat:52.5466,lng:13.3594}
];

// ---------- Hilfen ----------
const $=id=>document.getElementById(id);
const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function km(a,b){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
let langNames=null;try{langNames=new Intl.DisplayNames(["de"],{type:"language"})}catch(e){}
// Sprachname auf Deutsch; unbekannte Codes (z. B. "xx" = ohne Sprache) weglassen
const langName=c=>{if(!c||c==="xx")return"";try{const n=langNames?langNames.of(c):"";return n&&n!==c?n:""}catch(e){return""}};
const isoLocal=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayShort=["So","Mo","Di","Mi","Do","Fr","Sa"];

// Originaltitel, wenn er in lateinischer Schrift ist, sonst der englische Titel (TMDB)
const latin=/^[\p{Script=Latin}\p{N}\p{P}\p{S}\p{Zs}]+$/u;
const showTitle=f=>{
  if(f.orig&&latin.test(f.orig)) return f.orig;
  if(f.en&&latin.test(f.en)) return f.en;
  return f.title||f.orig||"?";
};

// ---------- Fassungslogik ----------
// Ergebnis: Liste der Kategorien (OV/OmU/OmeU) oder [] = Synchronfassung
// Kategorien einer Vorstellung: [{v:"OV"|"OmU"|"OmeU", unsure:true|false}], leer = Synchronfassung
function categories(show,film){
  // Script-Einschätzung: "yes" sicher deutschsprachig, "maybe" unsicher, "no" fremdsprachig
  let de=film&&film.de; if(de===true)de="yes"; if(de===false||de===undefined)de=(film&&film.lang==="de")?"yes":"no";
  if(!show.v.length){
    if(de==="yes") return [{v:"OV",unsure:false}];
    if(de==="maybe") return [{v:"OV",unsure:true}];
    return [];
  }
  const out=[];
  show.v.forEach(v=>{
    if(v==="DFmeU"){ if(de!=="no") out.push({v:"OmeU",unsure:de==="maybe"}); }
    else out.push({v,unsure:false});
  });
  return out;
}

// ---------- Zustand ----------
let DATA=null, DATES=[];
const DEFAULT={day:0,time:"20:00",tol:30,vers:["OV","OmU","OmeU"],origin:"nk-nord",radius:3,collapsed:false};
let S=Object.assign({},DEFAULT);
try{const saved=JSON.parse(localStorage.getItem("kino-jetzt")||"null");if(saved)S=Object.assign(S,saved)}catch(e){}
if(!ORIGINS.some(o=>o.id===S.origin))S.origin=DEFAULT.origin;
// Kinoauswahl: ältere Speicherformen übernehmen (cin bzw. add als Einzelauswahl)
if(S.sel===undefined) S.sel=(Array.isArray(S.cin)&&S.cin.length)?S.cin:(Array.isArray(S.add)&&S.add.length&&!(S.grp||[]).length)?S.add:null;
if(S.sel!==null&&!Array.isArray(S.sel)) S.sel=null;
delete S.cin; delete S.grp; delete S.add; delete S.rem;
// Beim Öffnen immer: heute, jetzige Uhrzeit auf die nächste Viertelstunde aufgerundet
// (kurz vor Mitternacht: morgen 00:00, das Zeitfenster reicht dann in den heutigen Abend zurück)
let START_PLUS_DAY=0;
{const n=new Date();let m=Math.ceil((n.getHours()*60+n.getMinutes())/15)*15;if(m>=1440){m-=1440;START_PLUS_DAY=1;}S.time=fmt(m);S.day=0;}
function save(){try{localStorage.setItem("kino-jetzt",JSON.stringify(S))}catch(e){}}

// Tage seit heute für ein ISO-Datum (für Zeitfenster über Mitternacht)
const dayDiff=iso=>Math.round((new Date(iso+"T12:00")-new Date(isoLocal(new Date())+"T12:00"))/864e5);
function dayLabel(i){
  const diff=dayDiff(DATES[i]);
  if(diff===0)return"Heute"; if(diff===1)return"Morgen";
  const d=new Date(DATES[i]+"T12:00");
  return dayShort[d.getDay()]+", "+d.getDate()+"."+(d.getMonth()+1)+".";
}
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
function segButtons(el,items,isOn,onClick){
  el.innerHTML="";
  items.forEach(it=>{
    const b=document.createElement("button");
    b.type="button";b.textContent=it.label;b.setAttribute("aria-pressed",isOn(it.value));
    b.onclick=()=>onClick(it.value);el.appendChild(b);
  });
}
// ---------- Kinoauswahl ----------
// Schnellwahl-Gruppen; die Zuordnung kommt aus den Daten (indiekino bzw. Website des Kinos)
// Die Kinos sind in drei Teile aufgeteilt, jeder Button steuert seinen Teil:
// Programmkinos (ohne Yorck), Yorck, Multiplexe. "Programmkinos" einschalten wählt Yorck mit aus.
const GROUPS=[
  {id:"pk",label:"Programmkinos",test:c=>!c.multiplex&&c.chain!=="yorck",with:["yorck"]},
  {id:"mp",label:"Multiplexe",test:c=>c.multiplex},
  {id:"yorck",label:"Yorck",test:c=>c.chain==="yorck"},
];
const groupIds=g=>Object.keys(DATA.cinemas).filter(k=>g.test(DATA.cinemas[k]));
const allIds=()=>Object.keys(DATA.cinemas);
// S.sel = null (alle Kinos, auch künftig neue) oder Liste der gewählten Kinos (leer = keins)
function cinemaSet(){return new Set(S.sel===null?allIds():S.sel)}
const allSelected=()=>S.sel===null;
function setSel(set){S.sel=allIds().every(k=>set.has(k))?null:[...set]}
const groupOn=g=>{const s=cinemaSet(),ids=groupIds(g);return ids.length>0&&ids.every(k=>s.has(k))};
function toggleGroup(g){
  const s=cinemaSet();
  if(groupOn(g)) groupIds(g).forEach(k=>s.delete(k));
  else{
    groupIds(g).forEach(k=>s.add(k));
    (g.with||[]).forEach(id=>groupIds(GROUPS.find(x=>x.id===id)).forEach(k=>s.add(k)));
  }
  setSel(s);
}
function groupButtons(el,after){
  el.innerHTML="";
  const add=(label,on,fn)=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed",on);b.onclick=fn;el.appendChild(b)};
  add("Alle",allSelected(),()=>{S.sel=allSelected()?[]:null;after()});
  GROUPS.forEach(g=>add(g.label,groupOn(g),()=>{toggleGroup(g);after()}));
  return add;
}
function renderCinemaControls(){
  if(!DATA) return;
  if(S.sel!==null) S.sel=S.sel.filter(k=>DATA.cinemas[k]);
  const add=groupButtons($("cgroups"),update);
  add("Liste …",false,openSheet);
  $("cinLbl").textContent=cinemaSet().size+" ausgewählt";
}
function openSheet(){$("sheet").classList.remove("hidden");$("cinSearch").value="";renderSheet();document.body.style.overflow="hidden"}
function closeSheet(){$("sheet").classList.add("hidden");document.body.style.overflow="";update()}
// Ortsteile: Neukölln, Kreuzberg, Mitte zuerst, dann von innen nach außen (Entfernung zum Alexanderplatz)
const FIRST=["Neukölln","Kreuzberg","Mitte"], CENTER={lat:52.5219,lng:13.4132};
function districtOrder(byD){
  const dist=d=>{const cs=byD[d].map(x=>x[1]).filter(c=>c.lat!=null);if(!cs.length)return 99;
    return km(CENTER,{lat:cs.reduce((a,c)=>a+c.lat,0)/cs.length,lng:cs.reduce((a,c)=>a+c.lng,0)/cs.length});};
  return Object.keys(byD).sort((a,b)=>{
    const fa=FIRST.indexOf(a),fb=FIRST.indexOf(b);
    if(fa>=0||fb>=0) return (fa<0?99:fa)-(fb<0?99:fb);
    return dist(a)-dist(b);
  });
}
function renderSheet(){
  groupButtons($("sheetGroups"),()=>{save();renderSheet();renderCinemaControls()});
  const sel=cinemaSet();
  $("sheetCount").textContent=sel.size+" von "+allIds().length+" ausgewählt";
  const q=$("cinSearch").value.trim().toLowerCase();
  const byD={};
  Object.entries(DATA.cinemas).forEach(([k,c])=>{
    if(q&&!(c.name.toLowerCase().includes(q)||(c.district||"").toLowerCase().includes(q))) return;
    (byD[c.district||"Sonstige"]=byD[c.district||"Sonstige"]||[]).push([k,c]);
  });
  const L=$("cinList"); L.innerHTML="";
  districtOrder(byD).forEach(d=>{
    const h=document.createElement("div");h.className="dist";h.textContent=d;L.appendChild(h);
    byD[d].sort((a,b)=>a[1].name.localeCompare(b[1].name,"de")).forEach(([k,c])=>{
      const row=document.createElement("label");row.className="cin";
      row.innerHTML=`<input type="checkbox" ${sel.has(k)?"checked":""}><span>${esc(c.name)}</span><small>${c.chain==="yorck"?"Yorck":c.multiplex?"Multiplex":""}</small>`;
      row.querySelector("input").onchange=e=>{
        const s=cinemaSet(); if(e.target.checked) s.add(k); else s.delete(k);
        setSel(s); save(); renderSheet(); renderCinemaControls();
      };
      L.appendChild(row);
    });
  });
  if(!L.children.length) L.innerHTML='<div class="empty" style="margin-top:12px">Kein Kino gefunden.</div>';
}

function renderControls(){
  renderCinemaControls();
  segButtons($("days"),[0,1].filter(i=>i<DATES.length).map(i=>({label:dayLabel(i),value:i})),v=>S.day===v,v=>{S.day=v;update()});
  const dm=$("dayMore");
  dm.classList.toggle("hidden",DATES.length<3);
  if(DATES.length>=3){dm.value=S.day>=2?String(S.day):"2";dm.classList.toggle("on",S.day>=2);}
  segButtons($("tol"),[15,30,45,60].map(v=>({label:"± "+v,value:v})),v=>S.tol===v,v=>{S.tol=v;update()});
  segButtons($("vers"),["OV","OmU","OmeU"].map(v=>({label:v,value:v})),v=>S.vers.includes(v),v=>{
    S.vers=S.vers.includes(v)?S.vers.filter(x=>x!==v):[...S.vers,v];update()});
  $("time").value=S.time;
  $("radius").value=S.radius;
  $("radLbl").textContent=S.radius>15?"ganz Berlin":String(S.radius).replace(".",",")+" km";
  const c=toMin(S.time);
  $("winLbl").textContent=fmt((c-S.tol+1440)%1440)+"–"+fmt(c+S.tol);
  $("more").classList.toggle("hidden",S.collapsed);
  $("moreBtn").textContent=S.collapsed?"Fassung & Ort anzeigen":"Filter einklappen";
}
function renderList(){
  const L=$("list");
  if(!DATA){return}
  // absolute Minuten ab heute 0:00, damit das Zeitfenster über Mitternacht reicht
  const center=dayDiff(DATES[S.day])*1440+toMin(S.time);
  const o=ORIGINS.find(x=>x.id===S.origin)||ORIGINS[0];
  let dub=0; const res=[];
  const allSel=allSelected(), cset=allSel?null:cinemaSet();
  DATA.shows.forEach(s=>{
    const m=toMin(s.t), abs=dayDiff(s.d)*1440+m;
    if(Math.abs(abs-center)>S.tol) return;
    const c=DATA.cinemas[s.c]; if(!c||c.lat==null) return;
    if(!allSel&&!cset.has(s.c)) return;
    const d=km(o,c); if(S.radius<=15&&d>S.radius) return;
    const f=DATA.films[s.f]||{};
    const cats=categories(s,f);
    if(S.vers.length){
      if(!cats.length){dub++;return}
      if(!cats.some(x=>S.vers.includes(x.v))) return;
    }
    res.push({s,m,abs,c,d,f,cats});
  });
  res.sort((a,b)=>a.abs-b.abs||a.d-b.d);
  $("count").textContent=res.length;
  $("hiddenInfo").textContent=dub?dub+" Synchronfassung"+(dub>1?"en":"")+" ausgeblendet":"";
  L.innerHTML="";
  if(!res.length){
    L.innerHTML=(cset&&!cset.size)?'<div class="empty">Kein Kino ausgewählt.</div>':'<div class="empty">Nichts im Zeitfenster und Umkreis.<br>Spielraum oder Radius vergrößern.</div>';return;
  }
  const frag=document.createDocumentFragment();
  res.forEach(({s,m,c,d,f,cats})=>{
    const el=document.createElement("div");el.className="card";
    // Nur gesicherte Sprachangaben (TMDB) anzeigen, kein Produktionsland
    const lang=(f.langs||[]).map(langName).filter(Boolean).join(", ");
    const end=f.min?`<small>bis ${fmt(m+f.min+15)}</small>`:"";
    const href=safeUrl(s.tk)||safeUrl(c.web)||safeUrl(c.url);
    // Regie · Jahr · Dauer · Genre (Genre gekürzt auf die ersten zwei Angaben)
    const genre=(f.genre||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,2).join(", ");
    const credits=[f.dir?"R: "+f.dir:"",f.year,f.min?f.min+" Min":"",genre].filter(Boolean).join(" · ");
    // Letterboxd: über TMDB-Nummer direkt zum Film, sonst Suche
    const lb=f.tmdb?`https://letterboxd.com/tmdb/${f.tmdb}/`:`https://letterboxd.com/search/films/${encodeURIComponent(showTitle(f).replace(/^((atmos|imax|d-box|4dx|3d|preview|premiere|vorpremiere|sneak)\s*[:,]\s*)+/i,""))}/`;
    const link=href?`<a class="tk${s.tkd?" direct":""}" href="${esc(href)}" target="_blank" rel="noopener">${s.tkd?"Tickets":"Zum Kino"}</a>`:"";
    el.innerHTML=`
      <div class="t">${esc(s.t)}${end}</div>
      <div>
        <p class="title"><a href="${esc(lb)}" target="_blank" rel="noopener">${esc(showTitle(f))}</a></p>
        ${credits?`<div class="credits">${esc(credits)}</div>`:""}
        <div class="meta" style="margin-top:6px">
          ${cats.length?cats.map(x=>`<span class="badge${x.unsure?" unsure":""}"${x.unsure?' title="Fassung nicht angegeben, vermutlich deutschsprachiges Original"':""}>${x.v}${x.unsure?"?":""}</span>`).join(""):'<span class="badge dub">Synchro</span>'}
          ${lang?`<span>${esc(lang)}</span>`:""}
        </div>
        <div class="row2">
          <div class="meta">
            <span class="cinema">${esc(c.name)}</span>
          </div>
          ${link}
        </div>
      </div>`;
    frag.appendChild(el);
  });
  L.appendChild(frag);
}
function update(){renderControls();renderList();save()}

function init(data){
  DATA=data;
  const today=isoLocal(new Date());
  DATES=[...new Set([today,...data.shows.map(s=>s.d)])].filter(d=>d>=today).sort().slice(0,8);
  S.day=Math.min(START_PLUS_DAY,DATES.length-1);
  // Warnung, wenn das Programm länger nicht aktualisiert wurde
  const ageH=(Date.now()-new Date(data.generated))/36e5;
  if(ageH>30){$("warn").textContent="Achtung: Programm zuletzt aktualisiert am "+new Date(data.generated).toLocaleString("de-DE",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"})+" Uhr";$("warn").classList.remove("hidden");}
  $("dayMore").innerHTML=DATES.slice(2).map((d,i)=>`<option value="${i+2}">${dayLabel(i+2)}</option>`).join("");
  const g=new Date(data.generated);
  $("foot").innerHTML='Stand: '+g.getDate()+"."+(g.getMonth()+1)+". "+fmt(g.getHours()*60+g.getMinutes())+' Uhr. Programmdaten: <a href="https://www.indiekino.de" target="_blank" rel="noopener">indiekino.de</a> und <a href="https://www.berlin.de/kino/" target="_blank" rel="noopener">berlin.de</a>.'+
    (data.tmdb?' Filmdaten teilweise von <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.':'');
  update();
}

// Startpunkte & Bedienelemente
ORIGINS.forEach(o=>{const op=document.createElement("option");op.value=o.id;op.textContent=o.name;$("origin").appendChild(op)});
$("origin").value=S.origin;
$("dayMore").onchange=e=>{S.day=Number(e.target.value);update()};
$("dayMore").onfocus=e=>{if(S.day<2){S.day=Number(e.target.value);update()}};
$("origin").onchange=e=>{S.origin=e.target.value;update()};
$("time").oninput=e=>{if(e.target.value){S.time=e.target.value;update()}};
$("radius").oninput=e=>{S.radius=Number(e.target.value);update()};
$("moreBtn").onclick=()=>{S.collapsed=!S.collapsed;update()};
$("cinSearch").oninput=renderSheet;
$("cinDone").onclick=closeSheet;

renderControls();

fetch("data.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(init).catch(e=>{
  $("list").innerHTML='<div class="empty">Programmdaten konnten nicht geladen werden.</div>';
});
</script>
