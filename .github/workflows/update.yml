name: Kinoprogramm aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 5:17 Uhr Berliner Zeit
    - cron: "17 12 * * *"  # und ca. 13:17 Uhr
  workflow_dispatch:        # manuell über "Run workflow"

permissions:
  contents: write

# nie zwei Läufe gleichzeitig (sonst Konflikte beim Speichern)
concurrency:
  group: kinoprogramm
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Programm abrufen
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TZ: Europe/Berlin
        run: python scripts/scrape.py

      - name: Änderungen speichern
        run: |
          git config user.name "kino-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json cache/
          git diff --cached --quiet || git commit -m "Programm aktualisiert"
          # falls du währenddessen Dateien hochgeladen hast: erst holen, dann speichern
          git pull --rebase
          git push
